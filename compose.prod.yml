services:
  teacher-story:
    container_name: teacher-story-godot
    image: ghcr.io/${GITHUB_REPOSITORY:-cmnemoi/teacher-story-godot}:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports: ["127.0.0.1:8110:8080"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
